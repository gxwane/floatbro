version: 2
updates:
  - package-ecosystem: "gradle"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "03:00"
      timezone: "Asia/Shanghai"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "automated-pr"
    commit-message:
      prefix: "chore(deps)"
      include: "scope"
    groups:
      testing:
        patterns:
          - "io.mockk:*"
          - "app.cash.turbine:*"
          - "junit:*"
      ui-utils:
        patterns:
          - "org.jsoup:*"
          - "com.jakewharton.timber:*"
    ignore:
      # 锁定核心构建链大版本与次版本，杜绝 SDK 37 / Gradle 9 冲突
      - dependency-name: "com.android.tools.build:gradle"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "com.android.application"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "com.android.library"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "gradle"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "gradle-wrapper"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      # 锁定 Kotlin 生态编译器 DSL 与元数据，杜绝 ICE 与 NoSuchMethodError
      - dependency-name: "org.jetbrains.kotlin:*"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "org.jetbrains.kotlin.*"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "com.google.devtools.ksp:*"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "org.jetbrains.kotlinx:kotlinx-serialization-json"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      # 锁定 AndroidX 核心库，防止拉入 compileSdk 37 依赖
      - dependency-name: "androidx.core:*"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "androidx.room:*"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "com.squareup.okhttp3:okhttp"
        update-types: ["version-update:semver-major"]
      - dependency-name: "io.insert-koin:*"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "03:00"
      timezone: "Asia/Shanghai"
    open-pull-requests-limit: 5
    labels:
      - "ci/cd"
      - "actions-update"
    commit-message:
      prefix: "ci(actions)"
