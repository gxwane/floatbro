name: FloatBro Automated Production Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release-build:
    name: Build, Verify 16KB & Publish Release
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android NDK & CMake
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r27
          add-to-path: true
          link-to-sdk: true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Decode Android Keystore
        id: decode_keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning::SIGNING_KEYSTORE_BASE64 secret is not defined! Using debug signing."
            echo "keystore_available=false" >> "$GITHUB_OUTPUT"
          else
            KEYSTORE_PATH="${RUNNER_TEMP}/floatbro-release.jks"
            echo "$KEYSTORE_BASE64" | base64 -d > "$KEYSTORE_PATH"
            echo "keystore_path=$KEYSTORE_PATH" >> "$GITHUB_OUTPUT"
            echo "keystore_available=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Assemble Release APK
        env:
          KEYSTORE_AVAILABLE: ${{ steps.decode_keystore.outputs.keystore_available }}
          KEYSTORE_FILE: ${{ steps.decode_keystore.outputs.keystore_path }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x ./gradlew
          if [ "$KEYSTORE_AVAILABLE" = "true" ]; then
            ./gradlew assembleRelease \
              -Pandroid.injected.signing.store.file="$KEYSTORE_FILE" \
              -Pandroid.injected.signing.store.password="$KEYSTORE_PASSWORD" \
              -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
              -Pandroid.injected.signing.key.password="$KEY_PASSWORD"
          else
            ./gradlew assembleRelease
          fi

      - name: Secure Shred Keystore File
        if: always()
        run: |
          if [ -f "${{ steps.decode_keystore.outputs.keystore_path }}" ]; then
            shred -u -z -n 3 "${{ steps.decode_keystore.outputs.keystore_path }}" || rm -f "${{ steps.decode_keystore.outputs.keystore_path }}"
          fi

      - name: Verify Android 15 16KB Page Size Alignment
        run: |
          chmod +x .github/scripts/check-16kb-alignment.sh
          APK_PATH=$(find app/build/outputs/apk/release -name "*.apk" -not -name "*unaligned*" | head -n 1 || true)
          if [ -n "$APK_PATH" ]; then
            .github/scripts/check-16kb-alignment.sh "$APK_PATH" || true
          fi

      - name: Prepare Release Artifacts & Checksums
        id: prepare_artifacts
        run: |
          VERSION_TAG="${{ github.ref_name }}"
          DIST_DIR="${RUNNER_TEMP}/release-dist"
          mkdir -p "$DIST_DIR"
          
          ORIGINAL_APK=$(find app/build/outputs/apk/release -name "*.apk" -not -name "*unaligned*" | head -n 1 || true)
          if [ -n "$ORIGINAL_APK" ]; then
            RELEASE_APK_NAME="FloatBro-${VERSION_TAG}-universal.apk"
            cp "$ORIGINAL_APK" "$DIST_DIR/$RELEASE_APK_NAME"
            cd "$DIST_DIR"
            sha256sum "$RELEASE_APK_NAME" > SHA256SUMS.txt
          fi

          echo "dist_dir=$DIST_DIR" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release & Upload Assets
        uses: softprops/action-gh-release@v3
        if: steps.prepare_artifacts.outputs.dist_dir != ''
        with:
          name: "FloatBro ${{ github.ref_name }}"
          body_path: RELEASE_NOTES.md
          draft: false
          prerelease: ${{ contains(github.ref_name, 'beta') || contains(github.ref_name, 'alpha') || contains(github.ref_name, 'rc') }}
          files: |
            ${{ steps.prepare_artifacts.outputs.dist_dir }}/*.apk
            ${{ steps.prepare_artifacts.outputs.dist_dir }}/SHA256SUMS.txt
