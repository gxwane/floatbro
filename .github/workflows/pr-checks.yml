name: FloatBro PR Checks & Code Quality

on:
  pull_request:
    branches:
      - main
      - dev
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.github/dependabot.yml'
  push:
    branches:
      - dev
    paths-ignore:
      - '**.md'
      - 'docs/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  code-quality:
    name: Code Quality & Style
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run Lint & Syntax Check
        run: ./gradlew lintDebug --continue || true

  build-debug:
    name: Assemble Debug Verification
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android NDK & CMake
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r27c
          add-to-path: true

      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ${{ runner.os }}-pr-build-ccache-${{ github.ref }}
          restore-keys: |
            ${{ runner.os }}-pr-build-ccache-dev
            ${{ runner.os }}-pr-build-ccache-
          max-size: 500M

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Assemble Debug APK
        run: |
          ./gradlew assembleDebug \
            -Dorg.gradle.parallel=true \
            -Dorg.gradle.caching=true \
            -Dorg.gradle.vfs.watch=false

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: floatbro-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 3
