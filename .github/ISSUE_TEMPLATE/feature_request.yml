name: 💡 需求与特性建议 (Feature Request)
description: 为 FloatBro 提出新想法、新功能或改进建议
title: "[FEAT]: "
labels: ["enhancement", "proposal"]
body:
  - type: markdown
    attributes:
      value: |
        欢迎为 FloatBro 的多任务生态贡献灵感！请详细阐述你的应用场景。

  - type: textarea
    id: problem
    attributes:
      label: 现实痛点 / 功能背景 (Problem Statement)
      description: 你遇到了什么场景，现有的悬浮或分屏功能为何无法满足？
      placeholder: "例如：在对照查看两份技术文档时，需要将两个视口左右联动锁定滚动..."
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: 建议的解决方案 (Proposed Solution)
      description: 你心目中最优雅的交互与实现形式是怎样的？
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 竞品参考或已考虑过的替代方案 (Alternatives Considered)
      description: 是否有桌面端或其他移动端浏览器的优秀方案可供参考？
