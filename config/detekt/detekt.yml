# Detekt Configuration for FloatBro
# High Signal-to-Noise Ratio (SNR) tuned for Compose, JNI, and Background Services

build:
  maxIssues: 0
  excludeCorrectable: false

complexity:
  active: true
  CyclomaticComplexMethod:
    active: true
    threshold: 15
    ignoreSingleWhenExpression: true
    ignoreSimpleWhenEntries: true
  LongMethod:
    active: true
    threshold: 100
  LongParameterList:
    active: true
    functionThreshold: 6
    constructorThreshold: 8
    ignoreDefaultParameters: true
    ignoreDataClasses: true
    ignoreAnnotated: ['Composable']
  LargeClass:
    active: true
    threshold: 1000
  TooManyFunctions:
    active: true
    thresholdInFiles: 40
    thresholdInClasses: 35
    thresholdInInterfaces: 15

naming:
  active: true
  FunctionNaming:
    active: true
    functionPattern: '^[a-zA-Z][a-zA-Z0-9]*$'
    excludeClassPattern: '$^'
    ignoreAnnotated: ['Composable']
  TopLevelPropertyNaming:
    active: true
    constantPattern: '[A-Z][_A-Z0-9]*'
    propertyPattern: '[a-zA-Z][_a-zA-Z0-9]*'

style:
  active: true
  ForbiddenComment:
    active: false
  LoopWithTooManyJumpStatements:
    active: false
  MaxLineLength:
    active: false
  MagicNumber:
    active: false # Compose layouts use extensive inline dimension and alpha constants
  UnusedPrivateMember:
    active: true
    allowedNames: '(_|ignored|expected)'
    ignoreAnnotated: ['Preview']
  ProtectedMemberInFinalClass:
    active: false # Compatibility with legacy native finalizers if needed
  WildcardImport:
    active: false
  ReturnCount:
    active: false

coroutines:
  active: true
  GlobalCoroutineUsage:
    active: true
  SuspendFunWithFlowReturnType:
    active: true

potential-bugs:
  active: true
  UnconditionalJumpStatementInLoop:
    active: true
  EqualsAlwaysReturnsTrueOrFalse:
    active: true
  InvalidRange:
    active: true

exceptions:
  active: true
  TooGenericExceptionCaught:
    active: false # Suppressed for System WindowManager edge-case interactions
